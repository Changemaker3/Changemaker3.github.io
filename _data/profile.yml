    我是复旦大学物理学系的博士研究生，研究兴趣主要是**凝聚态理论**与**高能理论**，尤其关注**三维共形场论（CFT）**和 **Ising 模型**。

    我希望理解高能描述与低能有效理论之间的联系，并探索量子场论的思想如何帮助我们认识临界现象以及多体系统中的普适行为。
  research_interests:
    - 三维共形场论
    - Ising 模型与临界现象
