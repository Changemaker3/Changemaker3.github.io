  biography: |
    I am a PhD student in the Department of Physics at Fudan University. My interests lie in **condensed matter theory** and **high energy theory**, with a particular focus on **three-dimensional conformal field theories (CFTs)** and the **Ising model**.

    I am interested in the connections between high energy descriptions and low energy effective theories, and in how ideas from quantum field theory help us understand critical phenomena and the universal behavior of many-body systems.
  research_interests:
    - Three-dimensional conformal field theories
    - The Ising model and critical phenomena
    - Connections between high energy and low energy theories
